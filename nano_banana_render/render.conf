# Provedor padrão no painel: codex, openai ou gemini.
provider=codex
# Modelo do agente Codex. Em branco usa a seleção automática do CLI.
agent_model=gpt-6.2-sol
# Executável do Codex no PATH ou caminho absoluto (sem aspas).
codex_executable=codex
# Modelo de imagem usado exclusivamente pelo provedor openai (API).
image_model=chatgpt-image-latest
